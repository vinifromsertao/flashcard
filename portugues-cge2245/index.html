<style>
/* Layout: palco fixo 1280x720 escalado para a tela; texto de apoio à esquerda, pergunta e alternativas à direita (tirinhas e imagens largas ficam em cima). */
:root {
  --bg: #e9edf3;
  --stage: #f8f9fb;
  --surface: #ffffff;
  --ink: #142033;
  --muted: #5b6577;
  --line: #d3dae5;
  --accent: #1f4fae;      /* azul de caneta, como na folha de respostas */
  --accent-soft: #e3eafa;
  --ok: #17784a;
  --ok-soft: #e1f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --font-text: "Literata", Georgia, "Times New Roman", serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070a10; --stage: #0f1521; --surface: #161e2d; --ink: #e7ebf3; --muted: #9aa5b8;
    --line: #2a3448; --accent: #8db0f5; --accent-soft: #1d2b49; --ok: #5cc890; --ok-soft: #133524;
    --bad: #f0857c; --bad-soft: #3d1a19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070a10; --stage: #0f1521; --surface: #161e2d; --ink: #e7ebf3; --muted: #9aa5b8;
  --line: #2a3448; --accent: #8db0f5; --accent-soft: #1d2b49; --ok: #5cc890; --ok-soft: #133524;
  --bad: #f0857c; --bad-soft: #3d1a19; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; box-sizing: border-box;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.is-full { padding: 0; }
#viewport { position: relative; width: 100%; height: 100%; }
#stage {
  position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
  transform-origin: 0 0; background: var(--stage);
  display: grid; grid-template-rows: 54px 1fr 58px;
  box-shadow: 0 10px 40px rgb(0 0 0 / .18); overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Cabeçalho */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand span { font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.chips { display: flex; gap: 5px; }
.chip {
  width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line);
  background: transparent; font-size: 13px; font-weight: 700; cursor: pointer;
  font-variant-numeric: tabular-nums; color: var(--muted); padding: 0;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.is-current { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip.is-done { border-color: var(--ok); color: var(--ok); }
.chip.is-current.is-done { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* Rodapé */
footer {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 24px; border-top: 1px solid var(--line); background: var(--surface);
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px;
  border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface);
  font-size: 15px; font-weight: 700; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn:disabled { opacity: .4; cursor: default; }
.tools { display: flex; gap: 8px; }
.keys { font-size: 12.5px; color: var(--muted); }
.keys kbd {
  font-family: var(--font-ui); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 5px; background: var(--stage);
}

/* Slides */
main { position: relative; min-height: 0; }
.slide { position: absolute; inset: 0; padding: 20px 24px; display: grid; gap: 22px; }
.slide[hidden] { display: none !important; }
.layout-split { grid-template-columns: 1.08fr 1fr; }
.layout-stack { grid-template-rows: auto minmax(0, 1fr); }

.support {
  min-height: 0; min-width: 0; overflow: hidden; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px;
  font-family: var(--font-text); line-height: 1.5; font-size: 20px;
}
.support .ref {
  font-family: var(--font-ui); font-size: .62em; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 .5em;
}
.support h3 { font-family: var(--font-text); font-weight: 600; font-size: 1.05em; margin: 0 0 .45em; text-wrap: balance; }
.support p { margin: 0 0 .55em; text-indent: 1.4em; }
.support p.noindent { text-indent: 0; }
.support .poem { margin: 0 0 .55em 1.2em; white-space: pre-line; text-indent: 0; }
.support .fonte {
  font-family: var(--font-ui); font-size: .58em; color: var(--muted); text-indent: 0;
  line-height: 1.35; margin-top: .7em; overflow-wrap: anywhere;
}
.support .tag { font-family: var(--font-ui); font-size: .7em; font-weight: 700; color: var(--muted); text-indent: 0; margin: .4em 0 .2em; }
.support figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.support figure img { display: block; border-radius: 4px; border: 1px solid var(--line); }
.layout-stack .support { padding: 12px 22px 8px; }
.layout-stack .support .ref { display: none; }
.layout-stack .support .fonte { margin-top: .4em; }
.layout-stack .support figure img { height: 222px; width: auto; max-width: 100%; object-fit: contain; }
.layout-split .support figure img { width: 100%; height: auto; max-height: 420px; object-fit: contain; }

.ask { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.layout-stack .ask { display: grid; grid-template-columns: 2.1fr 1fr; gap: 22px; }
.ask-body { flex: 1; min-height: 0; overflow: hidden; font-size: 22px; line-height: 1.35; display: flex; flex-direction: column; gap: .6em; }
.stem { margin: 0; font-weight: 700; display: flex; gap: .55em; align-items: flex-start; }
.stem .qn {
  font-family: var(--font-display); font-weight: 800; font-size: 1.5em; line-height: .9;
  color: var(--accent); font-variant-numeric: tabular-nums; flex: none;
}
.alts { list-style: none; margin: 0; padding: .3em 0 0; display: flex; flex-direction: column; gap: .42em; }
.alt {
  width: 100%; display: flex; align-items: flex-start; gap: .6em; text-align: left;
  padding: .38em .6em .38em .45em; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 1em; line-height: 1.32;
  transition: background-color .15s, border-color .15s;
}
.alt:hover { border-color: var(--accent); background: var(--accent-soft); }
.alt .bubble {
  flex: none; width: 1.45em; height: 1.45em; border-radius: 50%; border: 2px solid var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: .9em; color: var(--accent);
  margin-top: -.05em;
}
.alt .txt { flex: 1; min-width: 0; }
.alt { position: relative; }
.alt .mark {
  position: absolute; right: .5em; top: -.62em; font-weight: 700; font-size: .62em; line-height: 1;
  padding: .2em .5em; border-radius: 99px; background: var(--surface); letter-spacing: .03em;
}
.alt .mark:empty { display: none; }
.alt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.alt.is-right .bubble { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.alt.is-right .mark { color: var(--ok); }
.alt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.alt.is-wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.alt.is-wrong .mark { color: var(--bad); }
.alt.is-wrong .txt { color: var(--muted); }
.alt.is-active { box-shadow: 0 0 0 3px var(--accent-soft); }

.feedback {
  flex: none; height: 158px; overflow: hidden; border-radius: 10px; border: 1.5px dashed var(--line);
  padding: 12px 16px; font-size: 18px; line-height: 1.38; color: var(--muted); background: transparent;
}
.layout-stack .feedback { height: auto; }
.feedback .verdict { font-weight: 700; margin: 0 0 .25em; font-size: 1.05em; }
.feedback p { margin: 0; }
.feedback.ok { border: 1.5px solid var(--ok); background: var(--ok-soft); color: var(--ink); }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad { border: 1.5px solid var(--bad); background: var(--bad-soft); color: var(--ink); }
.feedback.bad .verdict { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .alt { transition: none; } }
</style>
</head>

const Q = [
{ n:1, ans:"d", layout:"split",
  support:`<div class="ref">O poema abaixo se refere à questão 1</div>
<h3>Hino Nacional</h3>
<div class="poem">(...)
Brasil, de amor eterno seja símbolo
O lábaro que ostentas estrelado,
E diga o verde-louro dessa flâmula
– "Paz no futuro e glória no passado."

Mas, se ergues da justiça a clava forte,
Verás que um filho teu não foge à luta,
Nem teme, quem te adora, a própria morte.

Terra adorada,
Entre outras mil,
És tu, Brasil,
Ó Pátria amada!
Dos filhos deste solo és mãe gentil,
Pátria amada,
Brasil!</div>
<p class="fonte">Fonte: fragmento de: BRASIL. Hino Nacional. Disponível em: &lt;https://www.planalto.gov.br/ccivil_03/constituicao/hino.htm&gt;. Acesso em: 29 out. 2025.</p>`,
  stem:`A expressão “mãe gentil” integra a construção do apelo patriótico. Essa escolha contribui para o argumento cívico ao`,
  alts:{
    a:["restringir o sentido de pátria a laços jurídicos, de caráter legalista.","“Mãe gentil” remete a afeto e acolhimento, não a leis ou vínculos jurídicos. Nada no trecho tem caráter legalista."],
    b:["objetivar a pátria por meio de terminologia técnica, neutralizando a emoção do enunciado.","Não há termo técnico na expressão. Ela é figurada e carregada de emoção, o oposto de neutralizar o enunciado."],
    c:["substituir “pátria” por um sinônimo literal, mantendo o mesmo efeito denotativo.","“Mãe” não é sinônimo literal de “pátria”. A expressão tem sentido conotativo (figurado): é uma metáfora, e não uma troca denotativa."],
    d:["humanizar a pátria, deslocando um conceito abstrato para o campo afetivo.","A pátria, ideia abstrata, ganha traços humanos de mãe que acolhe “os filhos deste solo”. Essa personificação aproxima o cidadão da nação pelo afeto e fortalece o apelo cívico."],
    e:["negar vínculos emocionais com a nação, reforçando certo distanciamento.","O hino faz o contrário: reforça o vínculo afetivo com expressões como “Terra adorada” e “Pátria amada”."]
  }},
{ n:2, ans:"e", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 2</div>
<h3>Banhos de mar</h3>
<p>Meu pai acreditava que todos os anos se devia fazer uma cura de banhos de mar. E nunca fui tão feliz quanto naquelas temporadas de banhos em Olinda, Recife.</p>
<p>Meu pai também acreditava que o banho de mar salutar era o tomado antes do sol nascer. Como explicar o que eu sentia de presente inaudito em sair de casa de madrugada e pegar o bonde vazio que nos levaria para Olinda ainda na escuridão?</p>
<p>De noite eu ia dormir, mas o coração se mantinha acordado, em expectativa. E de puro alvoroço, eu acordava às quatro e pouco da madrugada e despertava o resto da família. Vestíamo-nos depressa e saíamos em jejum. Porque meu pai acreditava que assim devia ser: em jejum. (…)</p>
<p>Meu pai acreditava que não se devia tomar logo banho de água doce: o mar devia ficar na nossa pele por algumas horas. Era contra a minha vontade que eu tomava um chuveiro que me deixava límpida e sem o mar.</p>
<p>A quem devo pedir que na minha vida se repita a felicidade? Como sentir com a frescura da inocência o sol vermelho se levantar? Nunca mais?</p>
<p>Nunca mais.</p>
<p>Nunca.</p>
<p class="fonte">Fonte: LISPECTOR, C. Banhos de mar. In: Todas as crônicas. Rio de Janeiro: Rocco, 2018.</p>`,
  stem:`Considerando-se a relação entre os mecanismos de referenciação e a construção de sentidos no texto, pode-se analisar que`,
  alts:{
    a:["a repetição de estruturas frasais com a presença de dois-pontos é evidente, cuja função textual é retomar as ideias retratadas de modo conclusivo.","Os dois-pontos não formam uma estrutura repetida que conclui ideias. Eles apenas introduzem um detalhamento (“em jejum”, “o mar devia ficar na nossa pele”). A estrutura que se repete é “Meu pai acreditava”."],
    b:["o trecho “Vestíamo-nos depressa” é um caso de referenciação lexical que ocorre com o objetivo de evitar a repetição do termo “família”.","A retomada em “Vestíamo-nos” é gramatical (desinência verbal e pronome “nos”), e não lexical. Referenciação lexical seria trocar “família” por outra palavra, como “os parentes”."],
    c:["a recorrência do termo “meu pai” é atribuída à pouca variedade lexical da narradora, que poderia utilizar pronomes ou expressões sinônimas.","A repetição é escolha estilística consciente, não falta de vocabulário. Trocar por pronomes apagaria o efeito expressivo da insistência."],
    d:["os casos de utilização dos dois-pontos poderiam ser substituídos por conjunções explicativas, sem grandes mudanças nos sentidos do texto.","Os dois-pontos destacam e isolam a informação (“assim devia ser: em jejum”). Trocá-los por conjunção mudaria o ritmo e a ênfase, e a frase nem sempre ficaria correta."],
    e:["a reiteração é um recurso utilizado na repetição do termo “meu pai”, a fim de evidenciar o impacto da figura do pai na memória da narradora.","A anáfora “Meu pai acreditava…” abre vários parágrafos. A reiteração mostra como as crenças e a autoridade do pai marcaram as lembranças da narradora."]
  }},

<div class="tag">Texto I</div>
<h3>Pagamento do 13º salário vai injetar R$ 369,4 bi na economia, estima Dieese</h3>
<p>O 13º salário vai beneficiar cerca de 95,3 milhões de trabalhadores. Os pagamentos da gratificação natalina aos profissionais vão resultar em um rendimento adicional estimado de, em média, R$ 3.512. A maior remuneração será destinada aos funcionários do setor de serviços, que inclui a administração pública (R$ 4.982,72), enquanto a menor é destinada à agropecuária (R$ 2.986,52).</p>
<p class="fonte">Fonte: Disponível em: &lt;https://economia.uol.com.br/noticias/redacao/2025/11/13/13--expectativa.htm&gt;. Acesso em: 13 nov. 2025.</p>
<div class="tag">Texto II</div>
<p>Com a chegada do fim do ano e das datas festivas, cresce a expectativa dos trabalhadores com carteira assinada pelo pagamento do 13º salário. Neste ano, a primeira parcela deve ser paga até o dia 30 de novembro. Como a data cai em um domingo, os empregadores têm até 28 de novembro para efetuar o pagamento (...) Além dos empregados com carteira assinada, aposentados e pensionistas do INSS (Instituto Nacional do Seguro Social) também têm direito ao benefício. Neste ano, o pagamento para esse público ocorreu de forma antecipada, entre abril e junho.</p>
<p class="fonte">Fonte: adaptado de: Disponível em: &lt;https://www.cnnbrasil.com.br/economia/financas/veja-quando-voce-deve-receber-a-primeira-parcela-do-13o-salario/&gt;. Acesso em: 13 nov. 2025.</p>`,
  stem:`Considerando os textos, percebe-se que cada um adota um enfoque distinto sobre o pagamento do 13º salário. A diferença de abordagem evidencia graus distintos de parcialidade porque`,
  alts:{
    a:["o texto I privilegia informações objetivas e quantitativas, enquanto o texto II é mais voltado à expectativa do trabalhador.","O texto I é feito de números (R$ 369,4 bi, 95,3 milhões, valores por setor). O texto II parte da “expectativa dos trabalhadores” e orienta sobre datas e direitos."],
    b:["o texto I discute o setor privado de maneira opinativa, enquanto o texto II aborda o INSS, garantindo caráter mais factual.","O texto I não é opinativo e cita também a administração pública. O texto II fala do INSS só no fim; seu foco são os trabalhadores com carteira assinada."],
    c:["o texto I expressa desconfiança em relação ao pagamento do 13º salário, enquanto o texto II se concentra na data do pagamento.","Nada no texto I sugere desconfiança. Ele apenas estima valores e beneficiados."],
    d:["o texto I assume uma postura crítica ao apresentar valores, enquanto o texto II demonstra neutralidade por ocultar os números.","Apresentar valores não é postura crítica. E o texto II não “oculta” números: ele traz datas e simplesmente tem outro foco."],
    e:["o texto I foca na apresentação de dados, o que aumenta sua parcialidade, enquanto o texto II busca a imparcialidade ao citar os grupos beneficiados.","Dados numéricos tornam o texto mais objetivo, e não mais parcial. A alternativa inverte a relação."]
  }},
{ n:5, ans:"e", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 5</div>
<p>Todo falante nativo de uma língua sabe essa língua. Saber uma língua, no sentido científico do verbo saber, significa conhecer intuitivamente e empregar com naturalidade as regras básicas de funcionamento dela.</p>
<p class="fonte">Fonte: BAGNO, M. Preconceito linguístico: o que é, como se faz. São Paulo: Edições Loyola, 2007. 49. ed.</p>`,
  stem:`Com base no texto, empregar a língua portuguesa a partir de seu funcionamento real significa`,
  alts:{
    a:["comunicar-se conforme a norma-padrão até em contextos informais.","Usar a norma-padrão em qualquer situação ignora a adequação ao contexto. Em situações informais, ela pode até soar inadequada."],
    b:["aprofundar-se em referências teóricas para conhecer seus usos.","Bagno diz que o saber é intuitivo. O falante nativo domina a língua sem estudar teoria."],
    c:["memorizar as regras da gramática normativa para preservar a língua.","O texto fala em conhecer as regras “intuitivamente”, e não em decorar a gramática normativa."],
    d:["dominar a norma-padrão para corrigir aqueles que não a seguem.","Corrigir quem não segue a norma-padrão é justamente o preconceito linguístico que Bagno critica."],
    e:["saber adequar-se a variedades linguísticas diversas na comunicação.","Quem sabe a língua usa suas regras com naturalidade e se adapta às diferentes variedades e situações de comunicação."]
  }},

  stem:`Na tirinha, o personagem Garfield utilizou um recurso de modalização para`,
  alts:{
    a:["reforçar um adjetivo e enfatizar seu sentido.","“Muito” intensifica “bom”, mas o modalizador que produz o humor é “felizmente”, e ele não reforça adjetivo nenhum."],
    b:["expor seu julgamento a respeito do colega Jon.","O advérbio “felizmente” revela a avaliação de Garfield: ele está aliviado por Jon (que usou lustra-móvel no cabelo) não fazer parte do “seu mundo”."],
    c:["contrapor seu humor no primeiro e no último quadrinho.","Garfield está tranquilo e satisfeito no primeiro e no último quadrinho. Não há mudança de humor a contrapor."],
    d:["estabelecer uma conexão entre duas ideias contraditórias.","Ligar ideias contraditórias é papel de conjunções adversativas (“mas”, “porém”). “Felizmente” expressa opinião, não oposição."],
    e:["concluir uma reflexão iniciada nos quadrinhos anteriores.","O último quadrinho comenta a cena de Jon com uma avaliação pessoal. O foco do recurso é o juízo do personagem, e não uma conclusão."]
  }},
{ n:7, ans:"a", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 7</div>
<h3>O estado lamentável da Bandeira do Brasil da Santa Casa de Misericórdia</h3>
<p>Quem passa pela Rua Santa Luzia, no Centro do Rio, sempre dá uma olhadinha na imponente fachada da centenária Santa Casa de Misericórdia, hospital mais antigo da cidade, fundado em 1852. Mas é impossível não notar que o pavilhão nacional precisa ser trocado - a Bandeira do Brasil está não só desbotada como rasgada.</p>
<p class="fonte">Fonte: Disponível em: &lt;https://oglobo.globo.com/blogs/ancelmo-gois/post/2025/08/o-estado-lamentavel-da-bandeira-do-brasil-da-santa-casa-de-misericordia.ghtml&gt;. Acesso em: 12 nov. 2025.</p>`,
  stem:`Nesse texto, a parcialidade do autor frente ao que vê é fortemente marcada pela`,
  alts:{
    a:["adjetivação que demarca um ponto de vista.","Adjetivos como “lamentável” e “imponente” expressam a avaliação do autor, ou seja, sua parcialidade."],
    b:["suposição de que pessoas passam pelo local.","Dizer que as pessoas passam pela rua é uma constatação genérica, não um julgamento do autor."],
    c:["informação sobre o ano de fundação do hospital.","1852 é um dado factual que pode ser verificado. Não expressa opinião."],
    d:["descrição de que a bandeira se encontra desbotada.","“Desbotada” e “rasgada” descrevem o estado físico da bandeira, algo que qualquer pessoa pode ver. A marca forte de opinião é “lamentável”."],
    e:["sugestão de que o hospital é o mais antigo da cidade.","Ser o mais antigo da cidade é informação factual, não ponto de vista."]
  }},
{ n:8, ans:"d", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 8</div>
<p>– Ei, moça. Por favor, vou querer essa opção de rodízio, com nachos, tacos al pastor, tostaticos e quesadilla.</p>
<p>– Para beber, um suco de abacaxi com hortelã.</p>
<p>– Obrigado!</p>
<p>Pelo pedido, já deve ter observado que estou em um restaurante mexicano. O dia em questão é 13 de maio, meu aniversário.</p>
<p>No restaurante, uma excelente comida que perfuma o ar e música ao vivo tocada por um grupo de Mariachis.</p>
<p>A combinação ideal e característica do México, que tem excelentes pratos e ritmos que só podem ser encontrados em restaurantes com essa temática.</p>
<p>Mas algo a mais chama a atenção... no rodízio proposto pelo restaurante (com as opções que acabei de citar), a maioria dos pratos guarda uma similaridade: a cor amarela.</p>
<p>(...)</p>
<p class="fonte">Fonte: CERQUEIRA, M. Tacos. In: MALULY, L. V. B. et al. Crônicas para ler e ouvir. Vol. 3. São Paulo: ECA-USP, 2023. p. 19.</p>`,
  stem:`No trecho do texto, as palavras e expressões usadas pelo narrador revelam uma atitude de`,
  alts:{
    a:["ironia e crítica à culinária mexicana.","Não há ironia nem crítica: o narrador elogia a comida (“excelente comida”, “excelentes pratos”)."],
    b:["neutralidade diante do ambiente descrito.","Palavras como “excelente” e “ideal” são avaliativas. O narrador não é neutro."],

{ n:9, ans:"b", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 9</div>
<p>Cientistas descobriram uma nova espécie de dinossauro que tinha uma crista de espinhos nas costas e no rabo. Acredita-se que o animal pré-histórico, cujos restos foram encontrados na Ilha de Wight, na Inglaterra, usava esses espinhos para atrair parceiros em potencial.</p>
<p>Identificada pelo Dr. Jeremy Lockwood, da Universidade de Portsmouth e do Museu de História Natural, a espécie ganhou o nome de <i>Istiorachis macarthurae</i>. Até então, a suposição era de que os fósseis de 125 milhões de anos tinham pertencido a outras duas espécies da Ilha de Wight.</p>
<p>Após comparar esses fósseis com uma base de dados de dinossauros com ossadas parecidas, Lockwood entendeu que eram únicos. "Embora o esqueleto não estivesse tão completo quanto alguns dos outros que foram encontrados, ninguém tinha realmente examinado de perto esses ossos antes", disse o pesquisador em entrevista ao jornal britânico The Guardian.</p>
<p>(...)</p>
<p class="fonte">Fonte: Disponível em: &lt;https://revistagalileu.globo.com/ciencia/arqueologia/noticia/2025/08/especie-de-dinossauro-com-crista-de-espinhos-nas-costas-e-descoberta-na-inglaterra.ghtml&gt;. Acesso em: 13 nov. 2025.</p>`,
  stem:`Esse texto foi publicado por uma revista especializada em ciência e contém, como característica marcante do gênero texto de divulgação científica, uma`,
  alts:{
    a:["menção ao museu em que a descoberta foi realizada.","O museu é a instituição do pesquisador; os fósseis foram achados na Ilha de Wight. E citar uma instituição é detalhe, não traço marcante do gênero."],
    b:["comunicação de uma descoberta recente da área da paleontologia.","O texto de divulgação científica leva ao público leigo, em linguagem acessível, novidades da ciência, como a descoberta de uma nova espécie de dinossauro."],
    c:["explicação sobre como se realiza um processo de datação de fósseis.","O texto apenas informa a idade dos fósseis (125 milhões de anos). Não explica como a datação é feita."],
    d:["comparação entre os procedimentos adotados por diferentes cientistas.","Só um pesquisador é citado. A comparação feita foi entre fósseis, e não entre métodos de cientistas."],
    e:["discussão entre cientistas sobre como nomear uma espécie do passado.","O nome da espécie é apenas informado. Não há debate sobre ele."]

{ n:10, ans:"c", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 10</div>
<p>(...) São mais de 480 milhões de dispositivos digitais em uso – uma média de 2,2 aparelhos por habitante, segundo levantamento da Fundação Getulio Vargas (FGV), divulgado em junho de 2024. A revolução tecnológica do final do século 20 e início do século 21 colocou em nossas mãos aparelhos que transformaram o modo em que vivemos, mediando praticamente todas as atividades presentes em nossas rotinas.</p>
<p>As telas, presentes em smartphones, tablets e outros dispositivos digitais, nos oferecem um fluxo constante – quase infinito – de informações e conteúdos que se renovam a todo momento. É impossível absorver tudo isso.</p>
<p>De acordo com o psiquiatra Pedro Pan, “fomos evoluindo como sociedade, nessas últimas décadas, fomos assumindo muitas tarefas e tentando tocar várias coisas ao mesmo tempo. E, na verdade, a percepção é que o cérebro não conseguiu acompanhar toda essa ideia e tudo que a tecnologia trouxe para a gente de possibilidade”.</p>
<p>E as grandes empresas de tecnologia sabem disso. Quanto mais tempo gastarmos com redes sociais, por exemplo, mais fácil para elas de capitalizar. (…)</p>
<p>Leonardo Ramos é estudante de história e assume que o uso excessivo de telas tem prejudicado sua vida. (…) O estudante já chegou a ficar 14 horas conectado ao celular, vendo vídeos e redes sociais.</p>
<p>Com os celulares cada vez mais presentes, as telas estão fisgando as crianças cada vez mais cedo, em estágios cruciais para o seu desenvolvimento. Um estudo do Cetic, órgão vinculado ao Comitê Gestor da Internet no Brasil, revelou que quase metade das crianças até 2 anos – 44% delas – já têm acesso à internet. Depois da pandemia da covid-19, o número de crianças com idades entre 6 e 8 anos que têm seu próprio telefone celular quase dobrou. Passou de 18% para 36%. (…)</p>
<p class="fonte">Fonte: Disponível em: &lt;https://agenciabrasil.ebc.com.br/geral/noticia/2025-04/caminhos-da-reportagem-debate-uso-excessivo-de-telas&gt;. Acesso em: 01 nov. 2025.</p>`,
  stem:`Identifique o trecho do texto que funciona como estratégia argumentativa baseada em exemplificação.`,
  alts:{
    a:["“As telas, presentes em smartphones, tablets e outros dispositivos digitais, nos oferecem um fluxo constante – quase infinito – de informações e conteúdos que se renovam a todo momento. É impossível absorver tudo isso.”","É uma afirmação geral, uma constatação sobre as telas. Não traz um caso concreto que sirva de exemplo."],
    b:["“De acordo com o psiquiatra Pedro Pan, ‘fomos evoluindo como sociedade, nessas últimas décadas, fomos assumindo muitas tarefas e tentando tocar várias coisas ao mesmo tempo. (…)’”","Aqui o recurso é o argumento de autoridade: a voz de um especialista (psiquiatra) confirma a ideia."],
    c:["“Leonardo Ramos é estudante de história e assume que o uso excessivo de telas tem prejudicado sua vida. (…) O estudante já chegou a ficar 14 horas conectado ao celular, vendo vídeos e redes sociais.”","O caso real de Leonardo, que chegou a passar 14 horas no celular, ilustra concretamente a tese do uso excessivo de telas. Isso é exemplificação."],
    d:["“Com os celulares cada vez mais presentes, as telas estão fisgando cada vez mais cedo, em estágios cruciais para o seu desenvolvimento.”","É uma afirmação geral que introduz o tema das crianças, sem apresentar um exemplo específico."],
    e:["“Um estudo do Cetic, órgão vinculado ao Comitê Gestor da Internet no Brasil, revelou que quase metade das crianças até 2 anos – 44% delas – já têm acesso à internet.”","Esse trecho usa dados estatísticos de uma pesquisa (argumento por comprovação), e não um exemplo concreto."]
  }},

  stem:`A argumentação construída pelo personagem Calvin para expressar seu desejo de ir ao parquinho pode ser considerada`,
  alts:{
    a:["coerente, de modo a garantir a concretização de seu desejo de ir ao parque.","O desejo não se realiza: no último quadrinho, Calvin é levado para fora da sala gritando “Socorro! Ditadura!”."],
    b:["infundada, devido à falta de elementos de autoridade que legitimem os argumentos.","Calvin até recorre a uma autoridade: ele invoca a Constituição. O problema não é a falta de autoridade."],
    c:["válida, mas ineficiente para exercer o desejo do personagem, devido à falta de compreensão da professora.","A professora entende o argumento. Ele falha porque não é pertinente na sala de aula, e não porque ela deixou de compreendê-lo."],
    d:["contraditória, pois apesar de apresentar bom embasamento proporciona ao personagem o inverso de seu desejo.","A premissa (“os ignorantes é que são felizes”) é um dito popular, não um bom embasamento. O raciocínio também não é contraditório: é encadeado, só que inadequado."],
    e:["lógica, mas ineficaz para mudar sua situação devido à falta de pertinência do argumento no contexto.","O raciocínio tem encadeamento lógico (premissa, conclusão, decisão), mas não cabe numa aula. Por isso não funciona, e Calvin acaba punido."]
  }},
{ n:12, ans:"a", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 12</div>
<h3>A última vez de uma criança antes de aprender a ler</h3>
<p>Lembro da vontade de aprender a ler e, finalmente, ser igual “gente grande”. Mais que vontade, era uma urgência! Por quanto tempo encarei a capa de “Chapeuzinho Amarelo”, determinada a dar o grande salto de ler o primeiro livro. Mas, então, como ficaria aquela versão de mim que, há pouco tempo, não sabia juntar “lé” com “cré”?</p>
<p>A infância é uma época marcada por uma série de primeiras vezes: o primeiro passo, a primeira palavra, o primeiro joelho ralado, o primeiro dente mole, e por aí vai. Mas, também há o caminho inverso das coisas: o das últimas vezes. A última vez em que acreditamos em guardiões mágicos como o papai Noel e fada do dente, a última vez que sentimos medo de dormir sozinhos ou o último momento antes de estar prestes a dizer nossa primeira palavra.</p>
<p class="fonte">Fonte: HADDAD, B. A última vez de uma criança antes de aprender a ler. In: MALULY, L. V. B. et al. (orgs). Crônicas para ler e ouvir. Número 6. São Paulo: ECA-USP, 2025. p. 46.</p>`,
  stem:`A alternância entre os tempos verbais pretérito imperfeito (“era”, “sabia”) e presente (“é”, “há”) tem o efeito de`,
  alts:{
    a:["unir recordação e reflexão, mostrando como a narradora revive o passado enquanto interpreta suas lembranças no presente.","O imperfeito traz as lembranças da infância (“era uma urgência”, “não sabia”). O presente traz a reflexão adulta sobre elas (“A infância é…”, “há o caminho inverso”)."],
    b:["indicar incerteza e dúvida, sugerindo que a narradora não se lembra com clareza dos fatos vividos na infância.","A narradora lembra com clareza (“Lembro da vontade…”). O pretérito imperfeito não indica dúvida."],
    c:["expressar desejo e hipótese, revelando que a narradora gostaria de retornar ao tempo da infância.","Desejo e hipótese são expressos pelo subjuntivo ou pelo futuro do pretérito (“gostaria”), e não pelo imperfeito e pelo presente."],
    d:["mostrar continuidade de ações, apresentando a infância como um processo que ainda não terminou.","O presente aqui é atemporal, de verdade geral (“A infância é uma época…”). Não diz que a infância da narradora continua."],
    e:["descrever ações simultâneas, em que passado e presente ocorrem ao mesmo tempo.","Os fatos não são simultâneos: o passado é lembrado e o presente é o momento em que a narradora reflete sobre ele."]
  }},
{ n:13, ans:"b", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 13</div>
<p>No Brasil, em 2014, o Grêmio foi eliminado da Copa do Brasil e multado em R$ 50 mil, após torcedores proferirem insultos racistas contra o goleiro Aranha, do Santos, durante uma partida. Essa decisão histórica do Superior Tribunal de Justiça Desportiva (STJD) marcou um momento importante na luta contra o racismo nos estádios.</p>
<p>No último ano, o STJD multou o Corinthians em R$ 50 mil, após torcedores realizarem gestos provocativos e desrespeitosos contra o Grêmio. Os envolvidos foram identificados e estão sujeitos a sanções, como a proibição de frequentar estádios por até um ano, de acordo com a legislação vigente.</p>
<p>Alguns podem até achar exagero, mas o esporte é muito mais do que uma partida, é um espelho de quem somos como sociedade. Então, que tal refletirmos um pouco mais sobre o tipo de “futebol” que queremos jogar? Porque, convenhamos, torcer é gritar, é vibrar, mas nunca deve ser sinônimo de ofender.</p>
<p class="fonte">Fonte: adaptado de: LISBOA, G. Preconceito no esporte está saindo de campo. Conjur, 25 jan. 2025. Disponível em: &lt;https://www.conjur.com.br/2025-jan-27/preconceito-no-esporte-esta-saindo-de-campo/&gt;. Acesso em: 13 nov. 2025.</p>`,
  stem:`No texto, é possível identificar a presença de informações factuais e de trechos opinativos utilizados pelo autor para construir sua argumentação. Nesse sentido, o texto traz uma opinião ao`,
  alts:{
    a:["indicar que a legislação atual estabelece períodos de suspensão para infratores.","A suspensão de até um ano está na “legislação vigente”: é um fato, não uma opinião."],
    b:["demonstrar preocupação com episódios de violência e preconceito nos estádios.","No último parágrafo o autor se posiciona: “o esporte é muito mais do que uma partida”, “torcer… nunca deve ser sinônimo de ofender”. É ali que está a opinião."],
    c:["citar a identificação de torcedores envolvidos nos crimes e as punições previstas em lei.","A identificação dos torcedores e as punições são informações factuais."],
    d:["relatar decisões do tribunal esportivo referentes a multas aplicadas em anos diferentes.","As multas de 2014 e do último ano são fatos relatados, que podem ser verificados."],
    e:["mencionar penalidades aplicadas a clubes em razão de condutas ofensivas de torcedores.","Mencionar as penalidades é informar. Isso não expressa o ponto de vista do autor."]
  }},

  stem:`A frase estampada no lambe-lambe faz referência ao provérbio “o seguro morreu de velho”, estabelecendo um diálogo intertextual que altera o sentido tradicional do dito a fim de`,

{ n:15, ans:"b", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 15</div>
<p>Os caminhos da vida são tecidas por escolhas. A cada instante, somos convidados a optar entre múltiplas possibilidades: algumas conscientes, muitas automáticas. O que somos hoje — trabalho, nas relações, nas convicções — é consequência direta dessas escolhas e das ações que tomamos para realizá-las. E, como já lembrava Pablo Neruda, “você é livre para fazer suas escolhas, mas é prisioneiro das consequências”.</p>
<p>Essa condição de liberdade limitada pelas consequências nos obriga a encarar um dilema humano permanente: como acertar nas decisões que importam? Desde pequenas opções cotidianas — o prato do almoço, o livro a levar para casa — até decisões que transformam rotas de vida — casamento, filhos, profissão — o temor de errar acompanha cada passo. E errar, muitas vezes, não é apenas um revés individual: pode repercutir na coletividade, como vemos quando más escolhas sobre liderança e representação política resultam em crises e retrocessos.</p>
<p class="fonte">Fonte: Disponível em: &lt;https://agendacapital.com.br/o-poder-das-escolhas-entre-a-liberdade-e-as-consequencias/&gt;. Acesso em: 12 nov. 2025.</p>`,
  stem:`No texto, o autor incorpora a citação de Pablo Neruda para promover a reflexão sobre a relação entre liberdade e responsabilidade. O efeito de sentido produzido por essa apropriação textual é o de`,
  alts:{
    a:["substituir a necessidade de explicação autoral por uma opinião externa.","A citação não substitui a explicação: o autor continua desenvolvendo a ideia no parágrafo seguinte (“Essa condição de liberdade…”)."],
    b:["conferir autoridade ao argumento recorrendo à voz de um autor reconhecido.","É um argumento de autoridade: a voz de Neruda, poeta consagrado, dá credibilidade à ideia de que escolhas trazem consequências."],
    c:["introduzir uma crítica irônica às decisões políticas mencionadas posteriormente.","A citação não é irônica e não se refere à política. As decisões políticas só aparecem no fim, como exemplo."],
    d:["relativizar a ideia de liberdade individual, sugerindo que ela é meramente ilusória.","A citação afirma que “você é livre”. Ela limita a liberdade pelas consequências, mas não diz que ela é ilusória."],
    e:["criar um contraste humorístico entre a vida cotidiana e escolhas de grande impacto.","Não há humor na citação. O tom do texto é reflexivo e sério."]
  }},
{ n:16, ans:"a", layout:"split",
  support:`<div class="ref">O poema abaixo se refere à questão 16</div>
<div class="poem">(...)
Oh saudade! Oh martírio de alma nobre!
Malgrado o teu pungir, como és suave!
Como a rosa de espinhos guarnecida
Aguilhoa, e apraz co’o doce aroma,
Tu feres, e mitigas com lembranças.
Mas ah! o teu espinho ainda é mais duro;
E essas tuas lembranças são falazes,
Flores são que o punhal de Harmódio cobrem.
(...)</div>
<p class="fonte">Fonte: MAGALHÃES, G. de. Disponível em: &lt;https://www.academia.org.br/academicos/goncalves-de-magalhaes/textos-escolhidos&gt;. Acesso em: 12 nov. 2025.</p>`,
  stem:`Ao tratar da saudade, predomina no texto um recurso expressivo responsável por intensificar o caráter ambíguo do sentimento, que é o(a)`,
  alts:{
    a:["emprego de metáforas que associam sensações opostas.","A saudade é rosa com espinhos (fere e perfuma), martírio “suave”, flores que escondem um punhal. As imagens juntam dor e prazer, o que torna o sentimento ambíguo."],
    b:["repetição de vocativos que revela apelo emocional direto.","O vocativo “Oh saudade!” aparece, mas não predomina e não cria a ambiguidade. Quem faz isso são as imagens de sensações opostas."],
    c:["presença de hipérboles para enfatizar o sofrimento interior.","O poema não se apoia em exageros. O foco é o contraste entre dor e doçura."],
    d:["uso de inversões sintáticas para marcar o tom solene do poema.","Há inversões (“Flores são que o punhal de Harmódio cobrem”), mas elas marcam o estilo e não produzem a ambiguidade do sentimento."],
    e:["adoção de rimas regulares que reforçam a musicalidade dos versos.","Os versos são brancos (sem rima): nobre, suave, guarnecida, aroma, lembranças… não rimam entre si."]
  }},
{ n:17, ans:"d", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 17</div>
<p>Vejam pelo ponto de vista do médico. Estávamos em 1967. Até mesmo vidas como a dele, vidas profissionais vividas nos bairros elegantes, no meio do verde, tinham um estranho substrato, uma contracorrente originada em outro mundo - o universo baratinado à deriva da juventude sem sobrenomes - que tirava as pessoas do prumo. O que essa garotada está fazendo? Usando a linguagem dele, poderíamos chamar esse mundo de “ameaçador”. E aí, de repente, uma dessas jovens entra no seu consultório, ostentando no queixo um monte de espinhas e falando em monossílabos. Ele não pode, em sã consciência, devolvê-la a esse mundo, onde ela seria arrastada pela maré abaixo dos padrões da sociedade que volta e meia invade seu consultório e atira outras iguais a ela. Uma forma de medicina preventiva.</p>
<p class="fonte">Fonte: adaptado de: KAYSEN, S. Garota, interrompida. São Paulo: Editora Gente, 2013, p. 50.</p>`,
  stem:`Esse trecho, que aborda a internação da autora em um hospital psiquiátrico, expressa um ponto de vista que`,
  alts:{
    a:["difunde uma ideia solidária à situação.","O ponto de vista do médico não é solidário: ele vê a juventude como “ameaçadora” e interna a jovem por precaução."],
    b:["reitera a insubordinação dos pacientes.","O trecho não fala de pacientes rebeldes. A jovem apenas entra no consultório “falando em monossílabos”."],
    c:["reforça o desejo de superação da doença.","Nenhuma doença é apontada, e não se fala em superação. A internação se baseia em padrões sociais."],
    d:["colabora para a perpetuação de um estigma.","O médico interna a jovem por aparência e comportamento comuns (espinhas, monossílabos), tratando a juventude como ameaça. A “medicina preventiva”, dita com ironia, mostra como esse olhar perpetua um estigma."],
    e:["confirma a importância da ética na medicina.","A decisão do médico é apresentada com ironia e parece questionável. O trecho não exalta a ética médica."]
  }},
{ n:18, ans:"d", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 18</div>
<p>Não sei por quanto tempo ela esteve lá. Na porta da oficina. Os olhos de lâmpada de interrogatório policial. Venha até o fosso do castelo, eu queria dizer. Mas no fundo sabia que minha mãe comeria todos os jacarés, como nos comia vivos um pouco por dia. Agarrei a mão do meu pai. Vamos fugir para dentro do castelo, eu disse. Disse de verdade. Só nós dois, agora. Mas meu pai já não era o cavaleiro andante com coração de leão. Ele temia o dragão negro. Apenas disse. Vá com a sua mãe. Eu soube ali que estávamos perdidos.</p>
<p class="fonte">Fonte: BRUM, E. Uma duas. Porto Alegre: Arquipélago Editorial, 2018, p. 41.</p>`,
  stem:`Nesse trecho, a narradora compõe uma alegoria que representa a sua`,
  alts:{
    a:["tendência a mascarar seus sentimentos, que eram contraditórios.","A narradora não esconde o que sente: “Vamos fugir para dentro do castelo, eu disse. Disse de verdade.”"],
    b:["cumplicidade com o pai, que a protegia das intempéries de sua mãe.","O pai não a protege: “já não era o cavaleiro andante”, “temia o dragão negro” e manda a filha ir com a mãe."],
    c:["insatisfação com a vida, devido à proveniência de um lar desestruturado.","É uma generalização. A alegoria (castelo, jacarés, dragão negro) se concentra na relação com a mãe, e não numa insatisfação geral com a vida."],
    d:["dificuldade de relacionamento com a mãe, que ela considerava inclemente.","A mãe é o “dragão negro”, que “comeria todos os jacarés” e “nos comia vivos”, com olhos de “interrogatório policial”. A alegoria mostra uma mãe impiedosa e uma relação difícil."],
    e:["necessidade de fuga da realidade, devido aos problemas que tinha com a polícia.","“Interrogatório policial” é uma comparação para o olhar da mãe. Não há problemas reais com a polícia."]
  }},
{ n:19, ans:"c", layout:"split",
  support:`<div class="ref">O texto abaixo se refere à questão 19</div>
<p>Desde o pouso das sondas Vikings 1 e 2, em 1976, várias missões a Marte tentam entender o seu passado. E a mais recente delas sugere que o planeta vermelho pode ter tido um regime de estações úmidas e secas, iguais às que a gente tem aqui na Terra.</p>
<p>A pesquisa foi conduzida pela Universidade de Toulouse, na França, e publicada na revista Nature. Os cientistas utilizaram imagens captadas pelo rover espacial Curiosity da cratera de Gale, que possui 150 km de diâmetro e que, no passado, foi provavelmente um lago.</p>
<p>Na cratera, os cientistas encontraram sulcos em formas hexagonais na lama. Segundo os autores da pesquisa, esse padrão só pode ser encontrado em lugares em que haja uma alternância entre períodos secos e molhados. Os sulcos teriam 4 cm de largura e 2 cm de profundidade, o que indicaria uma certa regularidade entre os ciclos. Acredita-se que essa oscilação pode ter ocorrido ao longo de milhões de anos.</p>
<p>E como os sulcos se formaram? Ao que tudo indica, eles eram rachaduras no chão, que foram preenchidas por água e minerais durante o período de chuvas. Ao secar, os minerais se juntaram com a lama e formaram o molde hexagonal. Para William Rapin, líder do estudo, só um clima sazonal de alta frequência geológica como esse pode produzir esse tipo de rachadura.</p>
<p>“É a primeira vez que podemos mostrar que o clima sustentava mudanças hidrológicas sazonalmente, ou seja, estações úmidas e secas. Não tínhamos conhecimento que outros planetas além da Terra também tiveram isso”.</p>

const L = ["a","b","c","d","e"];
const state = Q.map(() => ({ picked: [], active: null }));
let cur = 0;

const $ = (s, r = document) => r.querySelector(s);
const slidesEl = $("#slides"), chipsEl = $("#chips");

Q.forEach((q, i) => {
  const chip = document.createElement("button");
  chip.type = "button"; chip.className = "chip"; chip.textContent = q.n;
  chip.setAttribute("aria-label", "Questão " + q.n);
  chip.addEventListener("click", () => go(i));
  chipsEl.appendChild(chip);

  const s = document.createElement("section");
  s.className = "slide layout-" + q.layout; s.hidden = true;
  s.setAttribute("aria-label", "Questão " + q.n);
  s.innerHTML = `<div class="support fit" data-max="21" data-min="12">${q.support}</div>
    <div class="ask">
      <div class="ask-body fit" data-max="23" data-min="13">
        <p class="stem"><span class="qn">${q.n}</span><span>${q.stem}</span></p>
        <ol class="alts">${L.map(l => `<li><button type="button" class="alt" data-l="${l}"><span class="bubble">${l}</span><span class="txt">${q.alts[l][0]}</span><span class="mark"></span></button></li>`).join("")}</ol>
      </div>
      <div class="feedback fit" data-max="19" data-min="12" aria-live="polite"></div>
    </div>`;
  s.querySelectorAll(".alt").forEach(b => b.addEventListener("click", () => choose(i, b.dataset.l)));
  slidesEl.appendChild(s);
});

function fit(el) {
  const max = +el.dataset.max, min = +el.dataset.min;
  let size = max;
  el.style.fontSize = size + "px";
  while (size > min && el.scrollHeight > el.clientHeight + 1) {
    size -= 0.5; el.style.fontSize = size + "px";
  }
}
function fitSlide(i) {
  const s = slidesEl.children[i];
  s.querySelectorAll(".support.fit, .ask-body.fit").forEach(fit);
  fit(s.querySelector(".feedback"));
}

function renderSlide(i) {
  const q = Q[i], st = state[i], s = slidesEl.children[i];
  const solved = st.picked.includes(q.ans);
  s.querySelectorAll(".alt").forEach(b => {
    const l = b.dataset.l, picked = st.picked.includes(l), right = l === q.ans;
    b.classList.toggle("is-right", picked && right);
    b.classList.toggle("is-wrong", picked && !right);
    b.classList.toggle("is-active", st.active === l);
    b.querySelector(".mark").textContent = picked ? (right ? "✓ Certa" : "✗ Errada") : "";
    b.setAttribute("aria-pressed", picked ? "true" : "false");
  });
  const fb = s.querySelector(".feedback");
  if (!st.active) {
    fb.className = "feedback fit";
    fb.innerHTML = `<p>Clique em uma alternativa (ou tecle <b>A</b> a <b>E</b>) para ver se ela está certa ou errada e por quê.</p>`;
  } else {
    const ok = st.active === q.ans;
    fb.className = "feedback fit " + (ok ? "ok" : "bad");
    fb.innerHTML = `<p class="verdict">${ok ? "✓ Alternativa " + st.active + " está certa" : "✗ Alternativa " + st.active + " está errada"}</p><p>${q.alts[st.active][1]}</p>`;
  }
  chipsEl.children[i].classList.toggle("is-done", solved);
  if (i === cur) {
    fit(fb);
    const body = s.querySelector(".ask-body");
    if (body.scrollHeight > body.clientHeight + 1) fit(body);
  }
}

function choose(i, l) {
  const st = state[i];
  if (!st.picked.includes(l)) st.picked.push(l);
  st.active = l;
  renderSlide(i);
}

function go(i) {
  if (i < 0 || i >= Q.length) return;
  slidesEl.children[cur].hidden = true;
  chipsEl.children[cur].classList.remove("is-current");
  cur = i;
  slidesEl.children[cur].hidden = false;
  chipsEl.children[cur].classList.add("is-current");
  chipsEl.children[cur].setAttribute("aria-current", "true");
  renderSlide(cur);
  fitSlide(cur);
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === Q.length - 1;
  try { history.replaceState(null, "", "#q" + Q[cur].n); } catch (e) {}
}

$("#prev").addEventListener("click", () => go(cur - 1));
$("#next").addEventListener("click", () => go(cur + 1));
$("#reveal").addEventListener("click", () => choose(cur, Q[cur].ans));
$("#reset").addEventListener("click", () => { state[cur] = { picked: [], active: null }; renderSlide(cur); });
$("#full").addEventListener("click", toggleFull);

function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("is-full", !!document.fullscreenElement);
  $("#full").textContent = document.fullscreenElement ? "Sair da tela cheia" : "Tela cheia";
  scale();
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (["arrowright", "pagedown"].includes(k)) { e.preventDefault(); go(cur + 1); }
  else if (["arrowleft", "pageup"].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (L.includes(k)) choose(cur, k);
  else if (k === "g") choose(cur, Q[cur].ans);
  else if (k === "f") toggleFull();
  else if (k === "home") go(0);
  else if (k === "end") go(Q.length - 1);
});

const stage = $("#stage"), vp = $("#viewport");
function scale() {
  const w = vp.clientWidth, h = vp.clientHeight;
  const k = Math.min(w / 1280, h / 720);
  stage.style.transform = `scale(${k})`;
  stage.style.left = (w - 1280 * k) / 2 + "px";
  stage.style.top = (h - 720 * k) / 2 + "px";
}
window.addEventListener("resize", scale);
scale();

const m = /^#q(\d+)$/.exec(location.hash);
go(m ? Math.min(Math.max(+m[1] - 1, 0), Q.length - 1) : 0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSlide(cur));
window.addEventListener("load", () => fitSlide(cur));
</script>
